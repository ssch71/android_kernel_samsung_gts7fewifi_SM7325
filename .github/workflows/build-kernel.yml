name: Build SM-T733 Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            python3 python2 make gcc \
            zip curl git ccache \
            lz4 binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            clang-11 lld-11 llvm-11 \
            device-tree-compiler

      - name: Set Clang 11 as default + fix all LLVM symlinks
        run: |
          # clang/lld
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-11 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/lld-11 100
          # 모든 llvm 툴을 -11 버전으로 강제 symlink
          for tool in ar nm objcopy objdump readelf size strip dis; do
            if [ -f /usr/bin/llvm-${tool}-11 ]; then
              sudo ln -sf /usr/bin/llvm-${tool}-11 /usr/bin/llvm-${tool}
            fi
          done
          # 확인
          echo "clang: $(clang --version | head -1)"
          echo "llvm-nm: $(llvm-nm --version | head -1)"
          echo "llvm-ar: $(llvm-ar --version | head -1)"

      - name: Fix all file permissions
        run: |
          # scripts 전체
          find scripts -type f \( -name "*.sh" -o -name "*.py" \) -exec chmod +x {} \;
          # arch 내 스크립트
          find arch -type f -name "*.sh" -exec chmod +x {} \;
          # tools 전체 바이너리
          find tools -type f ! -name "*.c" ! -name "*.h" ! -name "*.mk" ! -name "Makefile" -exec chmod +x {} \;

      - name: Set build variables
        run: |
          echo "BUILD_TIME=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Make output directory
        run: mkdir -p out

      - name: Build defconfig
        run: |
          make -C $(pwd) O=$(pwd)/out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            vendor/gts7fewifi_eur_open_defconfig

      - name: Build kernel
        run: |
          make -C $(pwd) O=$(pwd)/out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            -j$(nproc --all) 2>&1 | tee build.log

      - name: Check build output
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ 빌드 실패 - Image 파일 없음"
            grep -i "error:\|Permission denied\|not found\|\*\*\* \[" build.log \
              | grep -v "HDRINST\|can/error" | tail -30
            exit 1
          fi
          echo "✅ 빌드 성공"
          ls -lh out/arch/arm64/boot/

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/ssch71/AnyKernel3 AnyKernel3

      - name: Package kernel zip
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            cp out/arch/arm64/boot/dtb.img AnyKernel3/
          fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../SM-T733_Kernel_${{ env.BUILD_TIME }}.zip * \
            -x "*.git*" -x "README.md" -x "LICENSE"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: SM-T733_Kernel_${{ env.BUILD_TIME }}
          path: SM-T733_Kernel_*.zip
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
