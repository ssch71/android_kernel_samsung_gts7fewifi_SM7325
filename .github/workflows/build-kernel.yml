name: Build SM-T733 Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            python3 python2 make gcc \
            zip curl git ccache \
            lz4 binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            clang-11 lld-11 llvm-11 \
            device-tree-compiler

      - name: Fix all file permissions
        run: |
          find scripts -type f \( -name "*.sh" -o -name "*.py" \) -exec chmod +x {} \;
          find arch -type f -name "*.sh" -exec chmod +x {} \;
          find tools -type f ! -name "*.c" ! -name "*.h" ! -name "*.mk" \
            ! -name "Makefile" ! -name "*.txt" -exec chmod +x {} \;

      - name: Fix clang-11 incompatible errors
        run: |
          # 1. xt_mark.c - include 누락으로 인한 incomplete type
          # xt_tables.h include 추가
          sed -i '/#include <linux\/netfilter\/x_tables.h>/a #include <linux\/netfilter\/xt_mark.h>' \
            net/netfilter/xt_mark.c || true

          # 2. lahaina.c - register_tas25xx_bigdata_cb 선언 누락
          # Werror=implicit-function-declaration 만 해당 파일에서 비활성화
          sed -i 's/^ccflags-y\s*:=/ccflags-y += -Wno-implicit-function-declaration\nccflags-y :=/' \
            techpack/audio/asoc/Makefile || true
          # Makefile 없으면 직접 추가
          echo 'CFLAGS_lahaina.o += -Wno-implicit-function-declaration' >> \
            techpack/audio/asoc/Makefile

          # 3. cam_sysfs_init.c - old-style function definition
          echo 'CFLAGS_cam_sysfs_init.o += -Wno-strict-prototypes' >> \
            techpack/camera/drivers/cam_sensor_module/cam_sensor_utils/Makefile

      - name: Set build variables
        run: |
          echo "BUILD_TIME=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Make output directory
        run: mkdir -p out

      - name: Build defconfig
        run: |
          make -C $(pwd) O=$(pwd)/out \
            ARCH=arm64 \
            CC=clang-11 \
            LD=ld.lld-11 \
            AR=llvm-ar-11 \
            NM=llvm-nm-11 \
            OBJCOPY=llvm-objcopy-11 \
            OBJDUMP=llvm-objdump-11 \
            STRIP=llvm-strip-11 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            vendor/gts7fewifi_eur_open_defconfig

      - name: Build kernel
        run: |
          make -C $(pwd) O=$(pwd)/out \
            ARCH=arm64 \
            CC=clang-11 \
            LD=ld.lld-11 \
            AR=llvm-ar-11 \
            NM=llvm-nm-11 \
            OBJCOPY=llvm-objcopy-11 \
            OBJDUMP=llvm-objdump-11 \
            STRIP=llvm-strip-11 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            -j$(nproc --all) 2>&1 | tee build.log

      - name: Check build output
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ 빌드 실패 - Image 파일 없음"
            grep "error:" build.log \
              | grep -v "HDRINST\|can/error" | sort -u | tail -30
            exit 1
          fi
          echo "✅ 빌드 성공"
          ls -lh out/arch/arm64/boot/

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/ssch71/AnyKernel3 AnyKernel3

      - name: Package kernel zip
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            cp out/arch/arm64/boot/dtb.img AnyKernel3/
          fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../SM-T733_Kernel_${{ env.BUILD_TIME }}.zip * \
            -x "*.git*" -x "README.md" -x "LICENSE"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: SM-T733_Kernel_${{ env.BUILD_TIME }}
          path: SM-T733_Kernel_*.zip
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
